# CI of enigmoss/php-sdk.

stages: [quality, test, release]

variables:
  COMPOSER_NO_INTERACTION: "1"
  COMPOSER_CACHE_DIR: "$CI_PROJECT_DIR/.composer-cache"

cache:
  key: composer
  paths: [.composer-cache/]

.php:
  image: php:${PHP}-cli
  before_script:
    - apt-get -qq update && apt-get -qq install -y git unzip libzip-dev > /dev/null
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer > /dev/null

# --- quality: one cell on the newest PHP is enough ------------------------------------------
cs:
  extends: .php
  stage: quality
  variables: { PHP: "8.5" }
  script:
    - composer update --prefer-dist
    - composer lint

phpstan:
  extends: .php
  stage: quality
  variables: { PHP: "8.5" }
  script:
    - composer update --prefer-dist
    - vendor/bin/phpstan analyse --memory-limit=1G
    - vendor/bin/phpstan analyse -c phpstan-bridges.neon.dist --memory-limit=1G

dependencies:
  extends: .php
  stage: quality
  variables: { PHP: "8.5" }
  script:
    - composer validate --strict --no-check-lock
    - composer update --prefer-dist
    - composer deps

# --- tests: PHP matrix x lowest/highest; frameworks resolve to what each PHP supports ----------
tests:
  extends: .php
  stage: test
  parallel:
    matrix:
      - PHP: ["8.1", "8.2", "8.3", "8.4", "8.5"]
        DEPS: ["lowest", "highest"]
  script:
    - if [ "$DEPS" = "lowest" ]; then composer update --prefer-dist --prefer-lowest --prefer-stable; else composer update --prefer-dist; fi
    - vendor/bin/phpunit --testsuite unit,examples,bridge

# Explicit framework cells (the PHP matrix alone would not pin every major).
frameworks:
  extends: .php
  stage: test
  parallel:
    matrix:
      - { PHP: "8.1", PACKAGES: "orchestra/testbench:^8.0 symfony/framework-bundle:^6.4 symfony/http-client:^6.4" }
      - { PHP: "8.2", PACKAGES: "orchestra/testbench:^9.0 symfony/framework-bundle:^7.4 symfony/http-client:^7.4" }
      - { PHP: "8.3", PACKAGES: "orchestra/testbench:^10.0" }
      - { PHP: "8.4", PACKAGES: "orchestra/testbench:^11.0 symfony/framework-bundle:^8.0 symfony/http-client:^8.0" }
  script:
    - composer require --dev --no-update $PACKAGES
    - composer update --prefer-dist -W
    - vendor/bin/phpunit --testsuite bridge
    - vendor/bin/phpstan analyse -c phpstan-bridges.neon.dist --memory-limit=1G

# The package must work without ext-curl when a PSR-18 client is supplied, and must install
# from the distribution archive (export-ignore keeps tests out, docs and examples in).
archive:
  extends: .php
  stage: test
  variables: { PHP: "8.1" }
  script:
    - composer archive --format=zip --dir=build --file=package
    - test -n "$(unzip -l build/package.zip | grep 'docs/webhooks.md')"
    - test -z "$(unzip -l build/package.zip | grep ' tests/')"
    - mkdir -p /tmp/app && cd /tmp/app && composer init -n --name=check/app
    - composer config repositories.sdk '{"type":"artifact","url":"'"$CI_PROJECT_DIR"'/build"}'
    - composer require "enigmoss/php-sdk:*@dev" --prefer-dist
    - php -r 'require "vendor/autoload.php"; new Enigmoss\ClientConfig("https://api.example.com", "3f2b8c1e-5d4a-4e7b-9c6f-1a2b3c4d5e6f", new Enigmoss\Secret("k")); echo "ok\n";'

# --- release: the tag must match Version::SDK ------------------------------------------------
version:
  extends: .php
  stage: release
  variables: { PHP: "8.5" }
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - php bin/check-version "$CI_COMMIT_TAG"
