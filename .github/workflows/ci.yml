name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code style, static analysis, dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer validate --strict --no-check-lock
      - run: composer lint
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - run: vendor/bin/phpstan analyse -c phpstan-bridges.neon.dist --memory-limit=1G --no-progress
      - run: composer deps

  tests:
    name: PHP ${{ matrix.php }} (${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        deps: [lowest, highest]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - if: matrix.php == '8.1'
        run: composer remove --dev --no-update orchestra/testbench
      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.deps }}
      - if: matrix.php == '8.1'
        run: sh bin/test-without-laravel
      - if: matrix.php != '8.1'
        run: composer test

  frameworks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Laravel 12 + Symfony 7.4', php: '8.2', packages: 'orchestra/testbench:^10.0 symfony/framework-bundle:^7.4 symfony/http-client:^7.4' }
          - { name: 'Laravel 13 + Symfony 8', php: '8.4', packages: 'orchestra/testbench:^11.0 symfony/framework-bundle:^8.0 symfony/http-client:^8.0' }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer require --dev --no-update ${{ matrix.packages }}
      - run: composer update --prefer-dist --no-interaction -W
      - run: vendor/bin/phpunit --testsuite bridge
      - run: vendor/bin/phpstan analyse -c phpstan-bridges.neon.dist --memory-limit=1G --no-progress

  without-curl:
    name: Core without ext-curl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: :curl
          coverage: none
      # Only the test runner: proves the core installs and works with nothing but ext-json.
      - run: |
          composer remove --dev --no-update orchestra/testbench symfony/framework-bundle symfony/http-client guzzlehttp/guzzle psr/log psr/simple-cache friendsofphp/php-cs-fixer phpat/phpat phpstan/phpstan phpstan/phpstan-strict-rules shipmonk/composer-dependency-analyser
          composer update --prefer-dist --no-interaction
      - name: ext-curl is really absent
        run: |
          php -r 'exit(extension_loaded("curl") ? 1 : 0);'
      - run: vendor/bin/phpunit --testsuite unit

  archive:
    name: Install from the distribution archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none
      - run: sh bin/check-package
